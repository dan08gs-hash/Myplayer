            "app/src/main/java/com/mysf2/android/audio/SoundFontManager.kt": """package com.mysf2.android.audio

        import android.content.Context
        import android.net.Uri
        import android.provider.OpenableColumns
        import com.mysf2.android.model.SoundFontMeta
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.withContext
        import java.io.File
        import java.io.FileOutputStream

        class SoundFontManager(private val context: Context) {

            private val sf2Directory = File(context.filesDir, "soundfonts").apply {
                if (!exists()) mkdirs()
            }

            suspend fun importSoundFont(uri: Uri): Result<SoundFontMeta> = withContext(Dispatchers.IO) {
                try {
                    val fileName = queryFileName(uri) ?: "instrument.sf2"
                    val targetFile = File(sf2Directory, fileName)

                    context.contentResolver.openInputStream(uri)?.use { input ->
                        FileOutputStream(targetFile).use { output ->
                            input.copyTo(output, bufferSize = 64 * 1024)
                        }
                    } ?: return@withContext Result.failure(Exception("Não foi possível acessar o SF2."))

                    Result.success(
                        SoundFontMeta(
                            fileName = fileName,
                            absolutePath = targetFile.absolutePath,
                            sizeBytes = targetFile.length()
                        )
                    )
                } catch (e: Exception) {
                    Result.failure(e)
                }
            }

            private fun queryFileName(uri: Uri): String? {
                var name: String? = null
                if (uri.scheme == "content") {
                    context.contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                        val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                        if (nameIndex != -1 && cursor.moveToFirst()) {
                            name = cursor.getString(nameIndex)
                        }
                    }
                }
                return name ?: uri.lastPathSegment
            }
        }
        """,

            "app/src/main/java/com/mysf2/android/midi/MidiDeviceManager.kt": """package com.mysf2.android.midi

        import android.content.Context
        import android.media.midi.MidiDevice
        import android.media.midi.MidiDeviceInfo
        import android.media.midi.MidiManager
        import android.media.midi.MidiOutputPort
        import android.media.midi.MidiReceiver
        import android.os.Handler
        import android.os.Looper
        import com.mysf2.android.audio.NativeAudioEngine

        class MidiDeviceManager(context: Context) {

            private val midiManager = context.getSystemService(Context.MIDI_SERVICE) as? MidiManager
            private var openDevice: MidiDevice? = null
            private var outputPort: MidiOutputPort? = null

            var onDeviceConnected: ((String) -> Unit)? = null
            var onDeviceDisconnected: (() -> Unit)? = null

            private val midiReceiver = object : MidiReceiver() {
                override fun onSend(data: ByteArray, offset: Int, count: Int, timestamp: Long) {
                    var i = offset
                    val end = offset + count
                    while (i < end) {
                        val status = data[i].toInt() and 0xFF
                        if (status >= 0x80) {
                            val command = status and 0xF0
                            val channel = status and 0x0F

                            when (command) {
                                0x90 -> {
                                    if (i + 2 < end) {
                                        val key = data[i + 1].toInt() and 0x7F
                                        val vel = data[i + 2].toInt() and 0x7F
                                        if (vel > 0) {
                                            NativeAudioEngine.noteOn(channel, key, vel)
                                        } else {
                                            NativeAudioEngine.noteOff(channel, key)
                                        }
                                        i += 3
                                        continue
                                    }
                                }
                                0x80 -> {
                                    if (i + 2 < end) {
                                        val key = data[i + 1].toInt() and 0x7F
                                        NativeAudioEngine.noteOff(channel, key)
                                        i += 3
                                        continue
                                    }
                                }
                            }
                        }
                        i++
                    }
                }
            }

            fun startListening() {
                midiManager ?: return
                val devices = midiManager.devices
                if (devices.isNotEmpty()) openMidiDevice(devices[0])

                midiManager.registerDeviceCallback(object : MidiManager.DeviceCallback() {
                    override fun onDeviceAdded(deviceInfo: MidiDeviceInfo) {
                        openMidiDevice(deviceInfo)
                    }

                    override fun onDeviceRemoved(deviceInfo: MidiDeviceInfo) {
                        closeMidiDevice()
                    }
                }, Handler(Looper.getMainLooper()))
            }

            private fun openMidiDevice(deviceInfo: MidiDeviceInfo) {
                midiManager?.openDevice(deviceInfo, { device ->
                    if (device != null) {
                        openDevice = device
                        if (deviceInfo.outputPortCount > 0) {
                            outputPort = device.openOutputPort(0)
                            outputPort?.connect(midiReceiver)
                            val devName = deviceInfo.properties.getString(MidiDeviceInfo.PROPERTY_NAME) ?: "Dispositivo MIDI"
                            onDeviceConnected?.invoke(devName)
                        }
                    }
                }, Handler(Looper.getMainLooper()))
            }

            fun closeMidiDevice() {
                try {
                    outputPort?.close()
                    openDevice?.close()
                } catch (_: Exception) {}
                outputPort = null
                openDevice = null
                onDeviceDisconnected?.invoke()
            }
        }
        """,

            "app/src/main/java/com/mysf2/android/ui/AudioViewModel.kt": """package com.mysf2.android.ui

        import android.app.Application
        import android.net.Uri
        import androidx.lifecycle.AndroidViewModel
        import androidx.lifecycle.viewModelScope
        import com.mysf2.android.audio.NativeAudioEngine
        import com.mysf2.android.audio.SoundFontManager
        import com.mysf2.android.midi.MidiDeviceManager
        import com.mysf2.android.model.Preset
        import kotlinx.coroutines.flow.MutableStateFlow
        import kotlinx.coroutines.flow.StateFlow
        import kotlinx.coroutines.flow.asStateFlow
        import kotlinx.coroutines.flow.update
        import kotlinx.coroutines.launch

        data class UiState(
            val soundFontName: String? = null,
            val presets: List<Preset> = emptyList(),
            val selectedPreset: Preset? = null,
            val masterVolume: Float = 0.8f,
            val polyphony: Int = 64,
            val midiDeviceName: String? = null,
            val isLoading: Boolean = false,
            val errorMessage: String? = null,
            val activeKeys: Set<Int> = emptySet()
        )

        class AudioViewModel(application: Application) : AndroidViewModel(application) {

            private val _uiState = MutableStateFlow(UiState())
            val uiState: StateFlow<UiState> = _uiState.asStateFlow()

            private val soundFontManager = SoundFontManager(application)
            private val midiDeviceManager = MidiDeviceManager(application)

            init {
                NativeAudioEngine.init()
                NativeAudioEngine.start()
                NativeAudioEngine.setMasterVolume(0.8f)

                midiDeviceManager.onDeviceConnected = { name ->
                    _uiState.update { it.copy(midiDeviceName = name) }
                }
                midiDeviceManager.onDeviceDisconnected = {
                    _uiState.update { it.copy(midiDeviceName = null) }
                }
                midiDeviceManager.startListening()
            }

            fun loadSoundFontFromUri(uri: Uri) {
                viewModelScope.launch {
                    _uiState.update { it.copy(isLoading = true, errorMessage = null) }
                    val result = soundFontManager.importSoundFont(uri)

                    result.onSuccess { meta ->
                        val loaded = NativeAudioEngine.loadSoundFont(meta.absolutePath)
                        if (loaded) {
                            val presets = NativeAudioEngine.getPresets()
                            val defaultPreset = presets.firstOrNull()
                            if (defaultPreset != null) {
                                NativeAudioEngine.selectProgram(0, defaultPreset.bank, defaultPreset.program)
                            }

                            _uiState.update {
                                it.copy(
                                    soundFontName = meta.fileName,
                                    presets = presets,
                                    selectedPreset = defaultPreset,
                                    isLoading = false
                                )
                            }
                        } else {
                            _uiState.update {
                                it.copy(isLoading = false, errorMessage = "Formato de SoundFont inválido.")
                            }
                        }
                    }.onFailure { error ->
                        _uiState.update {
                            it.copy(isLoading = false, errorMessage = error.localizedMessage ?: "Erro ao abrir SoundFont.")
                        }
                    }
                }
            }

            fun selectPreset(preset: Preset) {
                NativeAudioEngine.selectProgram(0, preset.bank, preset.program)
                _uiState.update { it.copy(selectedPreset = preset) }
            }

            fun setMasterVolume(vol: Float) {
                NativeAudioEngine.setMasterVolume(vol)
                _uiState.update { it.copy(masterVolume = vol) }
            }

            fun noteOn(key: Int, velocity: Int = 100) {
                NativeAudioEngine.noteOn(0, key, velocity)
                _uiState.update { it.copy(activeKeys = it.activeKeys + key) }
            }

            fun noteOff(key: Int) {
                NativeAudioEngine.noteOff(0, key)
                _uiState.update { it.copy(activeKeys = it.activeKeys - key) }
            }

            override fun onCleared() {
                super.onCleared()
                midiDeviceManager.closeMidiDevice()
                NativeAudioEngine.stop()
                NativeAudioEngine.destroy()
            }
        }
        """,

            "app/src/main/java/com/mysf2/android/ui/components/VirtualKeyboard.kt": """package com.mysf2.android.ui.components

        import androidx.compose.foundation.background
        import androidx.compose.foundation.border
        import androidx.compose.foundation.gestures.awaitEachGesture
        import androidx.compose.foundation.gestures.awaitFirstDown
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.Text
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.input.pointer.PointerEventPass
        import androidx.compose.ui.input.pointer.pointerInput
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp

        private val BLACK_KEYS = setOf(1, 3, 6, 8, 10)

        @Composable
        fun VirtualKeyboard(
            startNote: Int = 48,
            totalWhiteKeys: Int = 14,
            activeNotes: Set<Int>,
            onNoteOn: (Int) -> Unit,
            onNoteOff: (Int) -> Unit,
            modifier: Modifier = Modifier
        ) {
            val whiteNotes = remember(startNote, totalWhiteKeys) {
                val list = mutableListOf<Int>()
                var curr = startNote
                while (list.size < totalWhiteKeys) {
                    val noteInOctave = curr % 12
                    if (noteInOctave !in BLACK_KEYS) list.add(curr)
                    curr++
                }
                list
            }

            BoxWithConstraints(
                modifier = modifier
                    .fillMaxWidth()
                    .height(180.dp)
                    .background(Color(0xFF1A1A1A))
            ) {
                val totalWidth = maxWidth
                val keyWidth = totalWidth / totalWhiteKeys

                Row(modifier = Modifier.fillMaxSize()) {
                    whiteNotes.forEach { note ->
                        val isPressed = activeNotes.contains(note)
                        Box(
                            modifier = Modifier
                                .width(keyWidth)
                                .fillMaxHeight()
                                .background(if (isPressed) Color(0xFF64B5F6) else Color.White)
                                .border(1.dp, Color.Black)
                                .pointerInput(note) {
                                    awaitEachGesture {
                                        awaitFirstDown(pass = PointerEventPass.Main)
                                        onNoteOn(note)
                                        waitForUpOrCancellation()
                                        onNoteOff(note)
                                    }
                                },
                            contentAlignment = Alignment.BottomCenter
                        ) {
                            if (note % 12 == 0) {
                                Text(
                                    text = "C${(note / 12) - 1}",
                                    fontSize = 11.sp,
                                    color = Color.DarkGray,
                                    modifier = Modifier.padding(bottom = 6.dp)
                                )
                            }
                        }
                    }
                }

                val blackKeyWidth = keyWidth * 0.65f
                val blackKeyHeight = maxHeight * 0.6f
                var currentX = 0.dp

                for (i in 0 until whiteNotes.size - 1) {
                    val currentNote = whiteNotes[i]
                    val nextNote = currentNote + 1
                    currentX += keyWidth

                    if ((nextNote % 12) in BLACK_KEYS) {
                        val isPressed = activeNotes.contains(nextNote)
                        val leftOffset = currentX - (blackKeyWidth / 2)

                        Box(
                            modifier = Modifier
                                .offset(x = leftOffset)
                                .width(blackKeyWidth)
                                .height(blackKeyHeight)
                                .background(if (isPressed) Color(0xFFE57373) else Color.Black)
                                .border(1.dp, Color.DarkGray)
                                .pointerInput(nextNote) {
                                    awaitEachGesture {
                                        awaitFirstDown(pass = PointerEventPass.Main)
                                        onNoteOn(nextNote)
                                        waitForUpOrCancellation()
                                        onNoteOff(nextNote)
                                    }
                                }
                        )
                    }
                }
            }
        }
        """,

            "app/src/main/java/com/mysf2/android/ui/MainScreen.kt": """package com.mysf2.android.ui

        import android.net.Uri
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.layout.*
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.Audiotrack
        import androidx.compose.material.icons.filled.FolderOpen
        import androidx.compose.material.icons.filled.Usb
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.unit.dp
        import com.mysf2.android.ui.components.VirtualKeyboard

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun MainScreen(viewModel: AudioViewModel) {
            val uiState by viewModel.uiState.collectAsState()
            val sf2Picker = rememberLauncherForActivityResult(
                contract = ActivityResultContracts.OpenDocument()
            ) { uri: Uri? -> uri?.let { viewModel.loadSoundFontFromUri(it) } }

            var expandedPresetDropdown by remember { mutableStateOf(false) }

            Scaffold(
                topBar = {
                    TopAppBar(
                        title = { Text("SF2 Player") },
                        colors = TopAppBarDefaults.topAppBarColors(
                            containerColor = MaterialTheme.colorScheme.primaryContainer,
                            titleContentColor = MaterialTheme.colorScheme.onPrimaryContainer
                        ),
                        actions = {
                            uiState.midiDeviceName?.let { deviceName ->
                                Row(
                                    verticalAlignment = Alignment.CenterVertically,
                                    modifier = Modifier.padding(end = 8.dp)
                                ) {
                                    Icon(Icons.Default.Usb, contentDescription = "MIDI", tint = Color(0xFF4CAF50))
                                    Spacer(Modifier.width(4.dp))
                                    Text(deviceName, style = MaterialTheme.typography.bodySmall)
                                }
                            }
                            IconButton(onClick = { sf2Picker.launch(arrayOf("*/*")) }) {
                                Icon(Icons.Default.FolderOpen, contentDescription = "Carregar SF2")
                            }
                        }
                    )
                }
            ) { innerPadding ->
                Column(
                    modifier = Modifier
                        .fillMaxSize()
                        .padding(innerPadding)
                        .padding(12.dp),
                    verticalArrangement = Arrangement.SpaceBetween
                ) {
                    Column {
                        Card(
                            modifier = Modifier.fillMaxWidth(),
                            colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
                        ) {
                            Column(modifier = Modifier.padding(14.dp)) {
                                Row(verticalAlignment = Alignment.CenterVertically) {
                                    Icon(Icons.Default.Audiotrack, contentDescription = null)
                                    Spacer(Modifier.width(8.dp))
                                    Text(
                                        text = uiState.soundFontName ?: "Nenhum SoundFont carregado",
                                        style = MaterialTheme.typography.titleMedium
                                    )
                                }

                                Spacer(Modifier.height(10.dp))

                                ExposedDropdownMenuBox(
                                    expanded = expandedPresetDropdown,
                                    onExpandedChange = { expandedPresetDropdown = !expandedPresetDropdown }
                                ) {
                                    OutlinedTextField(
                                        value = uiState.selectedPreset?.toString() ?: "Selecione o Instrumento",
                                        onValueChange = {},
                                        readOnly = true,
                                        label = { Text("Instrumento SF2") },
                                        trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded = expandedPresetDropdown) },
                                        modifier = Modifier.fillMaxWidth().menuAnchor(MenuAnchorType.PrimaryNotEditable)
                                    )

                                    ExposedDropdownMenu(
                                        expanded = expandedPresetDropdown,
                                        onDismissRequest = { expandedPresetDropdown = false }
                                    ) {
                                        uiState.presets.forEach { preset ->
                                            DropdownMenuItem(
                                                text = { Text(preset.toString()) },
                                                onClick = {
                                                    viewModel.selectPreset(preset)
                                                    expandedPresetDropdown = false
                                                }
                                            )
                                        }
                                    }
                                }

                                Spacer(Modifier.height(12.dp))

                                Text(
                                    text = "Volume Master: ${(uiState.masterVolume * 100).toInt()}%",
                                    style = MaterialTheme.typography.bodySmall
                                )
                                Slider(
                                    value = uiState.masterVolume,
                                    onValueChange = { viewModel.setMasterVolume(it) },
                                    valueRange = 0f..1.5f
                                )
                            }
                        }

                        if (uiState.isLoading) {
                            Spacer(Modifier.height(10.dp))
                            LinearProgressIndicator(modifier = Modifier.fillMaxWidth())
                        }

                        uiState.errorMessage?.let { error ->
                            Spacer(Modifier.height(8.dp))
                            Text(
                                text = error,
                                color = MaterialTheme.colorScheme.error,
                                style = MaterialTheme.typography.bodySmall
                            )
                        }
                    }

                    Column {
                        VirtualKeyboard(
                            startNote = 48,
                            totalWhiteKeys = 14,
                            activeNotes = uiState.activeKeys,
                            onNoteOn = { note -> viewModel.noteOn(note) },
                            onNoteOff = { note -> viewModel.noteOff(note) }
                        )
                    }
                }
            }
        }
        """,

            "app/src/main/java/com/mysf2/android/MainActivity.kt": """package com.mysf2.android

        import android.os.Bundle
        import androidx.activity.ComponentActivity

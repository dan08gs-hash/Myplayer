        }

        # Cria a arvore de pastas e arquivos no servidor do GitHub
        for path, content in files.items():
            os.makedirs(os.path.dirname(path), exist_ok=True)
            with open(path, "w", encoding="utf-8") as f:
                f.write(content)

        # Compacta tudo dentro de um arquivo ZIP completo do projeto
        with zipfile.ZipFile("SF2Player-ProjetoCompleto.zip", "w", zipfile.ZIP_DEFLATED) as zipf:
            for path in files.keys():
                zipf.write(path)

        print("Arquivos criados e ZIP empacotado com sucesso!")
        EOF

    - name: Disponibilizar o arquivo ZIP para Download
      uses: actions/upload-artifact@v4
      with:
        name: SF2Player-CodigoFonte-ZIP
        path: SF2Player-ProjetoCompleto.zip

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26d

    - name: Instalar Gradle e Compilar o APK
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Compilar APK (assembleDebug)
      run: gradle assembleDebug --stacktrace

    - name: Disponibilizar o APK Instalavel para Download
      uses: actions/upload-artifact@v4
      with:
        name: SF2Player-APK-Instalador
        path: app/build/outputs/apk/debug/app-debug.apk

name: Gerar SF2 Player e Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Criar Todos os Arquivos e Pastas do Projeto
      run: |
        python3 - << 'EOF'
        import os, zipfile, textwrap

        files = {
            "settings.gradle.kts": """
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "SF2Player"
            include(":app")
            """,

            "build.gradle.kts": """
            plugins {
                id("com.android.application") version "8.7.3" apply false
                id("org.jetbrains.kotlin.android") version "2.0.21" apply false
                id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
            }
            """,

            "gradle.properties": """
            org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
            android.useAndroidX=true
            android.nonTransitiveRClass=true
            """,

            "app/build.gradle.kts": """
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
                id("org.jetbrains.kotlin.plugin.compose")
            }

            android {
                namespace = "com.mysf2.android"
                compileSdk = 35

                defaultConfig {
                    applicationId = "com.mysf2.android"
                    minSdk = 26
                    targetSdk = 35
                    versionCode = 1
                    versionName = "1.0.0"

                    ndk {
                        abiFilters.addAll(listOf("arm64-v8a"))
                    }

                    externalNativeBuild {
                        cmake {
                            cppFlags("-std=c++17 -O3 -fexceptions -frtti")
                            arguments("-DANDROID_STL=c++_shared")
                        }
                    }
                }

                buildTypes {
                    release {
                        isMinifyEnabled = false
                        signingConfig = signingConfigs.getByName("debug")
                    }
                    debug {
                        isDebuggable = true
                    }
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }

                kotlinOptions {
                    jvmTarget = "17"
                }

                buildFeatures {
                    compose = true
                    prefab = true
                }

                externalNativeBuild {
                    cmake {
                        path = file("CMakeLists.txt")
                        version = "3.22.1"
                    }
                }

                packaging {
                    resources {
                        excludes += "/META-INF/{AL2.0,LGPL2.1}"
                    }
                }
            }

            dependencies {
                implementation("androidx.core:core-ktx:1.15.0")
                implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
                implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
                implementation("androidx.activity:activity-compose:1.10.1")

                val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
                implementation(composeBom)
                implementation("androidx.compose.ui:ui")
                implementation("androidx.compose.ui:ui-graphics")
                implementation("androidx.compose.ui:ui-tooling-preview")
                implementation("androidx.compose.material3:material3")
                implementation("androidx.compose.material:material-icons-extended")

                implementation("google.oboe:oboe:1.9.3")
                implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
            }
            """,

            "app/CMakeLists.txt": """
            cmake_minimum_required(VERSION 3.22.1)
            project(sf2_player_engine LANGUAGES C CXX)

            set(CMAKE_CXX_STANDARD 17)
            set(CMAKE_CXX_STANDARD_REQUIRED ON)

            find_package(oboe REQUIRED CONFIG)

            include(FetchContent)
            FetchContent_Declare(
                fluidlite
                GIT_REPOSITORY https://github.com/divideconcept/FluidLite.git
                GIT_TAG master
            )
            FetchContent_MakeAvailable(fluidlite)

            add_library(sf2engine SHARED
                src/main/cpp/sf2_engine.cpp
                src/main/cpp/jni_bridge.cpp
            )

            target_include_directories(sf2engine PRIVATE
                ${fluidlite_SOURCE_DIR}/include
                src/main/cpp
            )

            find_library(LOG_LIB log)
            find_library(OPENSLES_LIB OpenSLES)

            target_link_libraries(sf2engine
                PRIVATE
                oboe::oboe
                fluidlite
                ${LOG_LIB}
                ${OPENSLES_LIB}
            )
            """,

            "app/src/main/cpp/sf2_engine.h": """
            #ifndef SF2_ENGINE_H
            #define SF2_ENGINE_H

            #include <oboe/Oboe.h>
            #include <fluidlite.h>
            #include <string>
            #include <vector>
            #include <mutex>

            struct PresetInfo {
                int bank;
                int program;
                std::string name;
            };

            class SF2Engine : public oboe::AudioStreamDataCallback {
            public:
                SF2Engine();
                ~SF2Engine();

                bool startAudio();
                void stopAudio();

                bool loadSoundFont(const std::string& path);
                void unloadSoundFont();

                void noteOn(int channel, int key, int velocity);
                void noteOff(int channel, int key);
                void selectProgram(int channel, int bank, int program);
                void setMasterVolume(float volume);
                void setPolyphony(int polyphony);
                void allNotesOff();

                std::vector<PresetInfo> getPresets();
                bool isLoaded() const { return mSoundFontId >= 0; }

                oboe::DataCallbackResult onAudioReady(
                    oboe::AudioStream *oboeStream,
                    void *audioData,
                    int32_t numFrames) override;

            private:
                std::shared_ptr<oboe::AudioStream> mStream;
                fluid_settings_t* mSettings{nullptr};
                fluid_synth_t* mSynth{nullptr};
                int mSoundFontId{-1};

                int32_t mSampleRate{48000};
                const int32_t mChannelCount{2};

                std::mutex mSynthMutex;
                float mMasterVolume{1.0f};
            };

            #endif
            """,

            "app/src/main/cpp/sf2_engine.cpp": """
            #include "sf2_engine.h"
            #include <android/log.h>
            #include <cstring>

            #define TAG "SF2EngineNative"
            #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)
            #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

            SF2Engine::SF2Engine() {
                mSettings = new_fluid_settings();
                fluid_settings_setnum(mSettings, "synth.sample-rate", 48000.0);
                fluid_settings_setint(mSettings, "synth.polyphony", 64);
                mSynth = new_fluid_synth(mSettings);
            }

            SF2Engine::~SF2Engine() {
                stopAudio();
                if (mSynth) {
                    delete_fluid_synth(mSynth);
                    mSynth = nullptr;
                }
                if (mSettings) {
                    delete_fluid_settings(mSettings);
                    mSettings = nullptr;
                }
            }

            bool SF2Engine::startAudio() {
                std::lock_guard<std::mutex> lock(mSynthMutex);

                oboe::AudioStreamBuilder builder;
                builder.setDirection(oboe::Direction::Output)
                       ->setPerformanceMode(oboe::PerformanceMode::LowLatency)
                       ->setSharingMode(oboe::SharingMode::Exclusive)
                       ->setFormat(oboe::AudioFormat::Float)
                       ->setChannelCount(mChannelCount)
                       ->setSampleRate(mSampleRate)
                       ->setDataCallback(this);

                oboe::Result result = builder.openStream(mStream);
                if (result != oboe::Result::OK) return false;

                mSampleRate = mStream->getSampleRate();
                if (mSynth) {
                    fluid_synth_set_sample_rate(mSynth, (float)mSampleRate);
                }

                result = mStream->requestStart();
                if (result != oboe::Result::OK) {
                    mStream->close();
                    return false;
                }
                return true;
            }

            void SF2Engine::stopAudio() {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (mStream) {
                    mStream->stop();
                    mStream->close();
                    mStream.reset();
                }
            }

            bool SF2Engine::loadSoundFont(const std::string& path) {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (!mSynth) return false;

                if (mSoundFontId >= 0) {
                    fluid_synth_sfunload(mSynth, mSoundFontId, 1);
                    mSoundFontId = -1;
                }

                mSoundFontId = fluid_synth_sfload(mSynth, path.c_str(), 1);
                if (mSoundFontId < 0) return false;

                fluid_synth_program_select(mSynth, 0, mSoundFontId, 0, 0);
                return true;
            }

            void SF2Engine::unloadSoundFont() {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (mSynth && mSoundFontId >= 0) {
                    fluid_synth_sfunload(mSynth, mSoundFontId, 1);
                    mSoundFontId = -1;
                }
            }

            void SF2Engine::noteOn(int channel, int key, int velocity) {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (mSynth) fluid_synth_noteon(mSynth, channel, key, velocity);
            }

            void SF2Engine::noteOff(int channel, int key) {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (mSynth) fluid_synth_noteoff(mSynth, channel, key);
            }

            void SF2Engine::selectProgram(int channel, int bank, int program) {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (mSynth && mSoundFontId >= 0) {
                    fluid_synth_program_select(mSynth, channel, mSoundFontId, bank, program);
                }
            }

            void SF2Engine::setMasterVolume(float volume) {
                mMasterVolume = volume;
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (mSynth) fluid_synth_set_gain(mSynth, volume);
            }

            void SF2Engine::setPolyphony(int polyphony) {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (mSynth) fluid_synth_set_polyphony(mSynth, polyphony);
            }

            void SF2Engine::allNotesOff() {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                if (mSynth) fluid_synth_all_notes_off(mSynth, 0);
            }

            std::vector<PresetInfo> SF2Engine::getPresets() {
                std::lock_guard<std::mutex> lock(mSynthMutex);
                std::vector<PresetInfo> result;
                if (!mSynth || mSoundFontId < 0) return result;

                fluid_sfont_t* sfont = fluid_synth_get_sfont_by_id(mSynth, mSoundFontId);
                if (!sfont) return result;

                fluid_preset_t preset;
                fluid_sfont_iteration_start(sfont);
                while (fluid_sfont_iteration_next(sfont, &preset)) {
                    PresetInfo info;
                    info.bank = fluid_preset_get_banknum(&preset);
                    info.program = fluid_preset_get_num(&preset);
                    const char* name = fluid_preset_get_name(&preset);
                    info.name = (name != nullptr) ? std::string(name) : "Preset";
                    result.push_back(info);
                }
                return result;
            }

            oboe::DataCallbackResult SF2Engine::onAudioReady(
                oboe::AudioStream *oboeStream,
                void *audioData,
                int32_t numFrames) {

                auto *outputBuffer = static_cast<float *>(audioData);
                std::unique_lock<std::mutex> lock(mSynthMutex, std::try_to_lock);
                if (!lock.owns_lock() || !mSynth) {
                    std::memset(outputBuffer, 0, numFrames * mChannelCount * sizeof(float));
                    return oboe::DataCallbackResult::Continue;
                }

                int ret = fluid_synth_write_float(
                    mSynth,
                    numFrames,
                    outputBuffer, 0, 2,
                    outputBuffer, 1, 2
                );

                if (ret != 0) {
                    std::memset(outputBuffer, 0, numFrames * mChannelCount * sizeof(float));
                }
                return oboe::DataCallbackResult::Continue;
            }
            """,

            "app/src/main/cpp/jni_bridge.cpp": """
            #include <jni.h>
            #include <string>
            #include "sf2_engine.h"

            static SF2Engine* gEngine = nullptr;

            extern "C" {

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_init(JNIEnv *env, jobject thiz) {
                if (!gEngine) gEngine = new SF2Engine();
            }

            JNIEXPORT jboolean JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_start(JNIEnv *env, jobject thiz) {
                return (gEngine && gEngine->startAudio()) ? JNI_TRUE : JNI_FALSE;
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_stop(JNIEnv *env, jobject thiz) {
                if (gEngine) gEngine->stopAudio();
            }

            JNIEXPORT jboolean JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_loadSoundFont(JNIEnv *env, jobject thiz, jstring path) {
                if (!gEngine) return JNI_FALSE;
                const char *nativePath = env->GetStringUTFChars(path, nullptr);
                bool success = gEngine->loadSoundFont(std::string(nativePath));
                env->ReleaseStringUTFChars(path, nativePath);
                return success ? JNI_TRUE : JNI_FALSE;
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_unloadSoundFont(JNIEnv *env, jobject thiz) {
                if (gEngine) gEngine->unloadSoundFont();
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_noteOn(JNIEnv *env, jobject thiz, jint channel, jint key, jint velocity) {
                if (gEngine) gEngine->noteOn(channel, key, velocity);
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_noteOff(JNIEnv *env, jobject thiz, jint channel, jint key) {
                if (gEngine) gEngine->noteOff(channel, key);
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_selectProgram(JNIEnv *env, jobject thiz, jint channel, jint bank, jint program) {
                if (gEngine) gEngine->selectProgram(channel, bank, program);
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_setMasterVolume(JNIEnv *env, jobject thiz, jfloat volume) {
                if (gEngine) gEngine->setMasterVolume(volume);
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_setPolyphony(JNIEnv *env, jobject thiz, jint polyphony) {
                if (gEngine) gEngine->setPolyphony(polyphony);
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_allNotesOff(JNIEnv *env, jobject thiz) {
                if (gEngine) gEngine->allNotesOff();
            }

            JNIEXPORT jobject JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_getPresets(JNIEnv *env, jobject thiz) {
                jclass arrayListClass = env->FindClass("java/util/ArrayList");
                jmethodID arrayListInit = env->GetMethodID(arrayListClass, "<init>", "()V");
                jmethodID arrayListAdd = env->GetMethodID(arrayListClass, "add", "(Ljava/lang/Object;)Z");

                jclass presetClass = env->FindClass("com/mysf2/android/model/Preset");
                jmethodID presetInit = env->GetMethodID(presetClass, "<init>", "(IILjava/lang/String;)V");

                jobject listObj = env->NewObject(arrayListClass, arrayListInit);

                if (gEngine) {
                    auto presets = gEngine->getPresets();
                    for (const auto& p : presets) {
                        jstring nameStr = env->NewStringUTF(p.name.c_str());
                        jobject pObj = env->NewObject(presetClass, presetInit, p.bank, p.program, nameStr);
                        env->CallBooleanMethod(listObj, arrayListAdd, pObj);
                        env->DeleteLocalRef(nameStr);
                        env->DeleteLocalRef(pObj);
                    }
                }
                return listObj;
            }

            JNIEXPORT void JNICALL
            Java_com_mysf2_android_audio_NativeAudioEngine_destroy(JNIEnv *env, jobject thiz) {
                if (gEngine) {
                    delete gEngine;
                    gEngine = nullptr;
                }
            }

            }
            """,

            "app/src/main/java/com/mysf2/android/m
